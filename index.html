<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtDirector AI | Professional Studio Briefs</title>
  <meta name="description" content="AI-powered art director for concept artists and designers. Generate professional studio briefs with copyable PDF exports.">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ArtDirector AI: Production Ready Assignments">
  <meta property="og:description" content="Generate industry-standard briefs for Concept Art, 3D, and Materials with elite AI guidance.">
  <meta name="theme-color" content="#0a0a0a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    .mono {
      font-family: 'JetBrains+Mono', monospace;
    }
    .glass {
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 
       DEPLOYMENT-READY HIGH FIDELITY PRINT STYLES 
       Optimized for A4 selectable text PDF output.
    */
    @media print {
      @page {
        margin: 1.5cm;
        size: A4;
      }
      
      html, body {
        background-color: #0a0a0a !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      /* Hide UI elements that aren't part of the brief */
      .no-print, header, aside, footer, nav, button, input, select {
        display: none !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        background-color: #0a0a0a !important;
      }

      /* Flatten grid for PDF readability */
      .lg\:col-span-8 {
        grid-column: span 12 / span 12 !important;
        width: 100% !important;
      }

      .glass {
        background: #171717 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }

      /* Ensure gradients are converted to solid colors for PDF stability */
      .gradient-text {
        background: none !important;
        -webkit-background-clip: unset !important;
        -webkit-text-fill-color: #60a5fa !important;
        color: #60a5fa !important;
        font-weight: 800 !important;
      }

      .bg-gradient-to-br {
        background-image: linear-gradient(to bottom right, #18181b, #09090b) !important;
      }

      /* Force selectable text contrast */
      p, li, span, h1, h2, h3, h4 {
        color: #e5e5e5 !important;
        text-shadow: none !important;
        orphans: 3;
        widows: 3;
      }
      
      .text-blue-400 { color: #60a5fa !important; }
      .text-purple-400 { color: #a855f7 !important; }
      .text-zinc-400 { color: #a1a1aa !important; }

      img {
        max-height: 400px !important;
        object-fit: contain !important;
        border-radius: 12px !important;
        page-break-inside: avoid;
      }
      
      section, .rounded-xl {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
  <script>
    window.process = window.process || { env: { API_KEY: '' } };
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>

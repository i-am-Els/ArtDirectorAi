<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtDirector AI | Professional Studio Briefs</title>
  <meta name="description" content="AI-powered art director for concept artists and designers. Generate professional studio briefs with copyable PDF exports.">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ArtDirector AI: Production Ready Assignments">
  <meta property="og:description" content="Generate industry-standard briefs for Concept Art, 3D, and Materials with elite AI guidance.">
  <meta name="theme-color" content="#0a0a0a">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    .mono {
      font-family: 'JetBrains+Mono', monospace;
    }
    .glass {
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 
       PRODUCTION-GRADE PRINT ARCHITECTURE
       Optimized for Full-Bleed Letter Size PDF Output
    */
    @media print {
      @page {
        margin: 0;
        size: letter;
      }
      
      html, body {
        background-color: #0a0a0a !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Force background to fill the whole page */
      #root {
        background-color: #0a0a0a !important;
        width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Hide non-essential UI */
      .no-print, header, aside, footer, nav, button, input, select {
        display: none !important;
      }

      /* 
         FIX: Prevent "squished" content. 
         Force all nested containers to fill 100% width of the print area.
      */
      main {
        display: block !important;
        padding: 0.5in !important; /* Balanced margins for professional print appearance */
        margin: 0 !important;
        width: 100% !important;
        max-width: none !important;
        min-width: 100% !important;
        background-color: transparent !important;
        position: static !important;
      }

      .max-w-7xl {
        max-width: none !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .lg\:col-span-8, .lg\:col-span-12 {
        grid-column: span 12 / span 12 !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .glass {
        background: transparent !important;
        border: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        width: 100% !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      /* Reset component specific padding for print */
      .print\:p-0 {
        padding: 0 !important;
      }

      /* Visual fidelity adjustments */
      .gradient-text {
        background: none !important;
        -webkit-background-clip: unset !important;
        -webkit-text-fill-color: #60a5fa !important;
        color: #60a5fa !important;
        font-weight: 800 !important;
      }

      .bg-gradient-to-br {
        background-image: linear-gradient(to bottom right, #18181b, #09090b) !important;
      }

      p, li, span, h1, h2, h3, h4 {
        color: #e5e5e5 !important;
        text-shadow: none !important;
      }
      
      .text-blue-400 { color: #60a5fa !important; }
      .text-purple-400 { color: #a855f7 !important; }
      .text-zinc-400 { color: #a1a1aa !important; }

      section, .rounded-3xl, .rounded-xl, .rounded-2xl {
        page-break-inside: avoid;
        break-inside: avoid;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
      }
    }
  </style>
  <script>
    window.process = window.process || {};
    window.process.env = window.process.env || {};
    if (typeof window.process.env.API_KEY === 'undefined') {
      window.process.env.API_KEY = '';
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>

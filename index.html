<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtDirector AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    .mono {
      font-family: 'JetBrains+Mono', monospace;
    }
    .glass {
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 
       ULTRA HIGH FIDELITY PDF PRINT STYLES 
       This produces a selectable, interactive PDF that looks identical to the app.
    */
    @media print {
      @page {
        margin: 0.8cm;
        size: A4;
      }
      
      html, body {
        background-color: #0a0a0a !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
        overflow: visible !important;
        height: auto !important;
      }

      .no-print, header, aside, footer, nav, button {
        display: none !important;
      }

      #root {
        background-color: #0a0a0a !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
      }

      /* Flatten the layout for clean printing */
      .grid {
        display: grid !important;
      }
      
      .lg\:col-span-8 {
        grid-column: span 12 / span 12 !important;
        width: 100% !important;
      }

      .glass {
        background: #171717 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }

      /* Fix gradient text for PDF generation */
      .gradient-text {
        background: none !important;
        -webkit-background-clip: unset !important;
        -webkit-text-fill-color: #60a5fa !important;
        color: #60a5fa !important;
        font-weight: 800 !important;
      }

      /* Force background gradients to show */
      .bg-gradient-to-br {
        background-image: linear-gradient(to bottom right, #18181b, #09090b) !important;
      }

      .border-blue-500\/20 {
        border-color: rgba(59, 130, 246, 0.4) !important;
      }

      /* Prevent page breaks inside blocks */
      section, .p-6, .rounded-xl, .grid > div {
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 1.5rem;
      }

      img {
        max-width: 100% !important;
        height: auto !important;
        border-radius: 12px !important;
        display: block;
        margin: 1rem auto;
      }
      
      /* Ensure text is selectable and high contrast */
      p, li, span, h1, h2, h3, h4 {
        color: #e5e5e5 !important;
        text-shadow: none !important;
        user-select: text !important;
      }
      
      .text-blue-400 { color: #60a5fa !important; }
      .text-purple-400 { color: #a855f7 !important; }
      .text-zinc-400 { color: #a1a1aa !important; }
      .text-zinc-300 { color: #d4d4d8 !important; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
